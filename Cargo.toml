[package]
name = "slotr"
version = "0.2.0"
license = "MIT"
edition = "2024"
description = "A local, fair, memory-aware resource admission queue"
publish = false
rust-version = "1.99"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
time = { version = "0.3", features = ["formatting", "parsing"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process", "time"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
